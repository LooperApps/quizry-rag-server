services:
  - type: web
    name: quizry-rag-server
    runtime: python
    region: oregon  # change to frankfurt (eu-central) if your users are in the Middle East/EU
    plan: starter   # upgrade to standard for more RAM (recommended for large ingestion jobs)

    buildCommand: pip install --upgrade pip && pip install -r requirements.txt

    # Single gunicorn worker to avoid ChromaDB concurrent-write issues.
    # The event loop inside the worker handles concurrency for I/O-bound operations.
    # Increase --timeout for very large documents (current: 600s = 10 min).
    startCommand: >
      gunicorn app.main:app
      --worker-class uvicorn.workers.UvicornWorker
      --workers 1
      --bind 0.0.0.0:$PORT
      --timeout 600
      --keep-alive 5
      --access-logfile -

    healthCheckPath: /health

    envVars:
      # Set these in the Render dashboard — never commit real values.
      # Both model keys are REQUIRED: app/config.py declares them without a
      # default, so the process exits at import time if either is missing.
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

      # Ingest/retrieve credential for the FIRST app listed in RAG_APPS.
      - key: RAG_API_KEY
        sync: false

      # Secret for the /admin routes used by quizry-db-manager. If unset,
      # RAG_API_KEY is accepted instead — which lets any Cloud Function's
      # credential delete the index, so set this.
      - key: ADMIN_API_KEY
        sync: false

      # ── Apps (tenants) ──────────────────────────────────────────────────
      # One deployment, one ChromaDB volume, one collection per product.
      # Notebook IDs are only unique within a product, so a shared collection
      # would let one app's notebookId filter match the other's chunks.
      # The first entry is the default app: the one admin routes address when
      # no ?app= is given, and the one RAG_API_KEY authenticates.
      #
      # `notebook_docs` is quiz_main's existing production collection. Do not
      # rename it — the name is where the data already is.
      - key: RAG_APPS
        value: quiz_main:notebook_docs,daftar_ai:daftar_notebook_docs

      # Per-app ingest/retrieve keys as `id:key` pairs, for every app after the
      # first. Holds secrets, so set it in the dashboard.
      - key: RAG_APP_KEYS
        sync: false

      # Set to "false" to remove the /admin routes entirely.
      - key: ENABLE_ADMIN
        value: "true"

      # ChromaDB persistent disk mount point (shared by every app's collection)
      - key: CHROMA_PATH
        value: /data/chroma

      # LLM used for query rewriting and reranking
      - key: LITELLM_MODEL
        value: deepseek/deepseek-chat

      # Embedding model. Changing this invalidates every stored vector — the
      # old and new spaces are not comparable — so a change means re-ingesting
      # every source, not just a redeploy.
      - key: EMBEDDING_MODEL
        value: gemini/gemini-embedding-001

      # Vector size for NEW collections. Existing collections keep the size
      # they were built with (stored in their metadata; none = 3072), so this
      # only takes effect for a collection created after it changes — move an
      # app over with POST /admin/reembed, then point RAG_APPS at the result.
      # 768 holds ~4x the chunks of 3072 in the same RAM.
      - key: EMBEDDING_DIMENSIONS
        value: "768"

      - key: LOG_LEVEL
        value: INFO

      # /docs exposes every route and schema; keep it off unless debugging.
      - key: ENABLE_DOCS
        value: "false"

      # Disable ChromaDB telemetry (replaces the removed chromadb.config.Settings)
      - key: ANONYMIZED_TELEMETRY
        value: "false"

    disk:
      name: chroma-data
      mountPath: /data/chroma
      sizeGB: 10   # ~1M chunks; increase as your user base grows
